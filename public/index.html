home:()=>`<div class="hero"><img class="herologo" src="${IMG.logoT}" alt="Neapol Lake" width="720" height="784"></div>

function render(){nav();const k=tab=="sectors"&&$("#bn")?{n:$("#bn").value,p:$("#bp").value,s:$("#bs").value,x:$("#bpct")?$("#bpct").value:"50",y:$("#bdays")?$("#bdays").value:"1",d:getD(),o:!$("#cal").classList.contains("hide")}:null;
 $("#app").innerHTML=V[tab]();
 if(tab=="sectors"){if(k){$("#bn").value=k.n;$("#bp").value=k.p;$("#bs").value=k.s;if($("#bpct"))$("#bpct").value=k.x;if($("#bdays"))$("#bdays").value=k.y;if(k.d)setD(k.d);if(k.o)$("#cal").classList.remove("hide")}calRefresh()}}
function chk(){const d=getD(),n=days(),s=$("#bs")?$("#bs").value:1,cf=d?conflict(s,d,n):null,m=$("#bm");if(!m)return;
 m.innerHTML=cf?(cf.type==="comp"?`<div class="msg busy">${fmtD(cf.date)} — змагання${cf.c.name?" ("+esc(cf.c.name)+")":""}: бронювання недоступне.</div>`:`<div class="msg busy">Сектор ${s} зайнятий ${fmtD(cf.date)}. Оберіть інші дати або сектор.</div>`):"";
 const br=$("#brange");if(br)br.textContent=d?`Заїзд ${fmtD(d)}, виїзд ${fmtD(addDays(d,n))} · ${n} ${dword(n)}`:"";
 for(let i=1;i<=15;i++){const e=$("#st"+i);if(!e)continue;const c=d?conflict(i,d,n):null;e.innerHTML=!d?"—":c?(c.type==="comp"?'<span class="busy">змагання</span>':'<span class="busy">зайнято</span>'):'<span class="free">вільно</span>'}}
async function book(){const r={name:$("#bn").value.trim(),phone:$("#bp").value.trim(),sector:$("#bs").value,date:getD(),days:days()};
 const m=$("#bm");BOOKMSG="";$("#bok").innerHTML="";if(admin){r.name=r.name||"Адмін";r.phone=r.phone||"—"}if(!r.name||!r.phone||!r.date){m.innerHTML='<div class="msg busy">Заповніть усі поля.</div>';return}
 if(conflict(r.sector,r.date,r.days)){chk();return}
 if(!admin&&!$("#ba").checked){m.innerHTML='<div class="msg busy">Підтвердіть, що ознайомились з умовами бронювання.</div>';return}
 r.amount=admin?0:payAmt();r.paid=admin;if(!(await addBooking(r))){BOOKMSG=`<div class="msg busy">${esc(BERR||"Цей сектор на цю дату вже заброньовано.")}</div>`;$("#bok").innerHTML=BOOKMSG;calRefresh();return}

 BOOKMSG=`<div class="msg">✅ Заявку збережено: сектор ${r.sector}, заїзд ${fmtD(r.date)}, виїзд ${fmtD(addDays(r.date,r.days))} (${r.days} ${dword(r.days)}). Щоб бронь діяла, внесіть оплату ${r.amount} грн.${PAY_URL?"":" Реквізити для оплати надішле адміністратор у WhatsApp."}<div class="btns" style="margin-top:8px">${PAY_URL?`<a class="btn" href="${PAY_URL}" target="_blank" rel="noopener">Сплатити (Monobank)</a>`:""}<a class="btn" href="https://wa.me/${WA}?text=${t}" target="_blank" rel="noopener">Підтвердити у WhatsApp</a></div><div style="margin-top:8px;font-size:14px">Або зателефонуйте: <a href="tel:+380960888807">096 088 88 07</a></div></div>`;
 finishBooking()}
function addNews(){const t=$("#nt").value.trim();if(!t)return;S.news.unshift({id:Date.now(),title:t,text:$("#nx").value,warn:$("#nw").checked,date:today()});saveSite()}
function addComp(){const f=$("#cf").value,t=$("#ct").value||f;if(!f)return;S.comps.push({from:f,to:t,name:$("#cn").value});saveSite()}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};i.src=r.result};r.readAsDataURL(file)})}
async function addPhotos(fs){for(const f of fs)S.photos.unshift({id:Date.now()+Math.random(),src:await shrink(f)});saveSite()}

`Зберігати рибу (в тому числі і в коропових мішках).`,
`Використання в якості прикормки (Тигровий горіх, Горох, сирі або Ферментовані зернові).`,
`Переміщатись на авто по території в темну пору доби.`,
`Розводити багаття на відкритому ґрунті. Смітити, кидати недопалки на землю.`,
`Купатися у водоймі.`,
`Заходити в сектор інших відвідувачів без їхнього дозволу.`,
`Освітлювати воду фарами та будь-яким яскравим цілеспрямованим світлом.`,
`Фотографуватись з рибою стоячи (риба повинна бути виключно над матом, не більше 30 см над матом).`,
`Надмірно шуміти, кричати, голосно включати музику.`];
const MUST=[`Риболовний мат-люлька`,`Великий коропковий підсак (круглий або трикутний з м'якої тканини)`,`Сумка для зважування та відпускання риби (Слінг)`,`Антисептик для обробки ран`];
const rl=s=>esc(s).replace(/(ЗАБОРОНЕНО!?|ЗАБОРОНЕНІ\.?|Заборонено!)/g,'<span class="no">$1</span>');
const BOOK_TXT=`Бронювання здійснюється з передоплатою 50 або 100%. У разі неприбуття або відмови від прибуття на риболовлю передоплата не повертається! У цьому випадку рибалка має право попередити адміністрацію водойми за 5 діб та перенести свій візит на риболовлю, обравши той самий сектор або інший, за умови наявності вільного місця (на дату, яку він переобрав).`;
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmtD=d=>d.split("-").reverse().join(".");
const days=()=>{const e=$("#bdays");return e?Math.min(5,Math.max(1,+e.value||1)):1};
const dword=n=>n==1?"доба":n<5?"доби":"діб";
const busyOn=(s,d)=>Object.values(B).find(b=>+b.sector==+s&&d>=b.date&&d<=addDays(b.date,(b.days||1)-1));
const conflict=(s,d,n)=>{for(let i=0;i<n;i++){const x=addDays(d,i),c=compOn(x);if(c)return{type:"comp",date:x,c};if(busyOn(s,x))return{type:"busy",date:x}}return null};
function payUpd(){const o=$("#bpct");if(!o)return;const t=sectorPrice()*days();o.options[0].textContent="50% — "+Math.round(t/2)+" грн";o.options[1].textContent="100% — "+t+" грн"}
let BOOKMSG="";
function finishBooking(){const o=$("#bok");if(o)o.innerHTML=BOOKMSG;$("#bn").value="";$("#bp").value="";const a=$("#ba");if(a)a.checked=false;setD("");const dd=$("#bdays");if(dd)dd.value="1";$("#bm").innerHTML="";calRefresh();if(o)o.scrollIntoView({block:"center",behavior:"smooth"})}
const MN=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
let cm=new Date();cm=new Date(cm.getFullYear(),cm.getMonth(),1);
const getD=()=>{const e=$("#bd");return e&&e.dataset.v||""};
const setD=k=>{const e=$("#bd");e.dataset.v=k;e.value=k.split("-").reverse().join(".")};
const iso=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
function toggleCal(){const c=$("#cal");c.classList.toggle("hide");calRefresh();if(!c.classList.contains("hide"))setTimeout(()=>c.scrollIntoView({block:"nearest",behavior:"smooth"}),60)}
function calNav(n){cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);calRefresh()}
function pick(k){setD(k);$("#cal").classList.add("hide");calRefresh()}
function calRefresh(){const c=$("#cal");if(!c)return;payUpd();chk();if(c.classList.contains("hide"))return;
 const s=$("#bs").value,sel=getD(),t=today(),y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let g=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].map(x=>`<b class="wd">${x}</b>`).join("")+"<i></i>".repeat(first);
 for(let d=1;d<=n;d++){const k=iso(y,m,d),past=k<t,cls=(busyOn(s,k)?"busy":compOn(k)?"comp":"")+(sel&&k>=sel&&k<=addDays(sel,days()-1)?" cur":"");
  g+=`<button type="button" class="dy ${cls}" ${past?"disabled":""} onclick="pick('${k}')">${d}</button>`}
 c.innerHTML=`<div class="ch"><button type="button" onclick="calNav(-1)">‹</button><span>${MN[m]} ${y}</span><button type="button" onclick="calNav(1)">›</button></div><div class="cg">${g}</div><div class="leg">Сектор ${s}: <span class="busy">■ зайнято</span> · <span style="color:#ff9a3c">■ змагання</span> · ■ вільно</div>`}
function adminList(){const l=Object.entries(B).map(([k,b])=>Object.assign({k},b)).filter(b=>addDays(b.date,b.days||1)>=today()).sort((a,b)=>a.date.localeCompare(b.date)||a.sector-b.sector);
 return `<div class="card"><h3 style="margin-top:0">Бронювання (адмін)</h3>${l.length?`<div style="overflow-x:auto"><table><tr><th>Дата</th><th>Сектор</th><th>Ім'я</th><th>Телефон</th><th>Оплата</th><th></th></tr>${l.map(b=>`<tr><td>${esc(fmtD(b.date))}${(b.days||1)>1?` → ${esc(fmtD(addDays(b.date,b.days)))} (${b.days} ${dword(b.days)})`:""}</td><td>${esc(b.sector)}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${b.amount?esc(b.amount)+" грн ":""}${b.paid?"✅":"⏳"}</td><td>${b.paid?"":`<button class="btn" style="margin:0 6px 0 0" onclick="markPaid('${esc(b.k)}')">Оплачено</button>`}<button class="btn g" style="margin:0" onclick="cancelB('${esc(b.k)}',this)">Скасувати</button></td></tr>`).join("")}</table></div>`:"Бронювань поки немає."}</div>`}
async function cancelB(k,el){if(el&&!el.dataset.c){el.dataset.c=1;el.textContent="Точно скасувати?";setTimeout(()=>{el.dataset.c="";el.textContent="Скасувати"},4000);return}
 try{await api("DELETE","/api/bookings/"+k)}catch(e){toast("Не вдалося скасувати")}
 delete B[k];render()}
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".cw")){const c=$("#cal");if(c&&!c.classList.contains("hide")){c.classList.add("hide")}}});
$("#key").onclick=()=>{if(admin){admin=false;render();return}openLogin()};
function openLogin(){const d=document.createElement("div");d.id="lb";d.style.cursor="default";
 d.innerHTML=`<div class="card" style="width:min(340px,92%);margin:0"><h3 style="margin-top:0">Вхід адміна</h3><input id="lp" type="password" placeholder="Пароль" autocomplete="off"><div id="le" class="busy" style="min-height:24px;margin-top:6px"></div><div class="btns"><button class="btn" id="lok">Увійти</button><button class="btn g" id="lno">Скасувати</button></div></div>`;
 document.body.appendChild(d);const i=d.querySelector("#lp");i.focus();
 const ok=async()=>{try{const r=await api("POST","/api/login",{password:i.value});TOKEN=r.token;sessionStorage.setItem("t",TOKEN);admin=true;d.remove();load()}catch(e){d.querySelector("#le").textContent="Невірний пароль";i.select()}};
 d.querySelector("#lok").onclick=ok;d.querySelector("#lno").onclick=()=>d.remove();i.onkeydown=e=>{if(e.key==="Enter")ok()}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
document.addEventListener("click",e=>{const i=e.target.closest(".ph img");if(i){const d=document.createElement("div");d.id="lb";d.innerHTML=`<img src="${i.src}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const l=$("#lb");if(l)l.remove();const c=$("#cal");if(c)c.classList.add("hide")}});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{if(admin&&tab=="photos"&&e.dataTransfer.files.length){e.preventDefault();addPhotos(e.dataTransfer.files)}});
render();init();
</script><script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
